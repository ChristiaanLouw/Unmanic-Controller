services:
  unmanic-controller:
    image: ${DOCKER_IMAGE:-christiaanlouw/unmanic-controller:latest}
    container_name: unmanic-controller
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
      - "${WEBHOOK_PORT:-9777}:${WEBHOOK_PORT:-9777}"
    volumes:
      - ./data:/appdata
    environment:
      TZ: ${TZ:-UTC}
      WEB_PORT: ${WEB_PORT:-8080}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-9777}
      SECRET_KEY: ${SECRET_KEY:-change-me}
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/ChristiaanLouw/Unmanic-Controller/main/Container/static/unmanic-controller-icon.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
      net.unraid.docker.shell: "sh"
